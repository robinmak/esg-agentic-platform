[tool.poetry]
name = "esg-agentic-platform"
version = "0.1.0"
description = "Agentic AI platform for automated assessment of corporate TCFD climate disclosures."
authors = ["Robin Mak"]
license = "MIT"
readme = "../README.md"

[tool.poetry.dependencies]
python = ">=3.10.0,<3.12"
crewai = "^0.11.0"
crewai-tools = "*"
langchain-openai = "*"
langchain = "*"
langchain-community = "*"
openai = "*"
streamlit = "*"
unstructured = "==0.10.25"
requests = "*"
python-dotenv = "1.0.0"

[tool.pyright]
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md
useLibraryCodeForTypes = true
exclude = [".cache"]

[tool.ruff]
# https://beta.ruff.rs/docs/configuration/
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'ARG', 'SIM']
ignore = ['W291', 'W292', 'W293']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
